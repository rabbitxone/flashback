name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Flashback mod
        run: ./gradlew build -x test

      - name: Build server recorder plugin
        working-directory: server-plugin
        run: ./gradlew build

      - name: Upload Flashback mod
        uses: actions/upload-artifact@v4
        with:
          name: flashback-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Upload server recorder plugin
        uses: actions/upload-artifact@v4
        with:
          name: flashback-server-recorder
          path: server-plugin/build/libs/*.jar
