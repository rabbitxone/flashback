name: FlashbackServerRecorder
version: '${version}'
main: com.moulberry.flashback.serverrecorder.FlashbackServerRecorder
api-version: '26.1'
description: Records gameplay on the server into replays that can be opened with the Flashback mod.
authors: [Moulberry, flashback contributors]
commands:
  fbrec:
    description: Control server-side Flashback recordings
    usage: /fbrec <world|area|stop|list|marker|hud|verify> ...
    permission: flashbackrecorder.admin
permissions:
  flashbackrecorder.admin:
    description: Allows controlling server-side Flashback recordings
    default: op
